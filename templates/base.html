<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Stock Predictor{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <header class="navbar">
    <div class="nav-inner">
      <a class="brand" href="{{ url_for('index') }}">📈 StockSense</a>
      <nav>
        <a href="{{ url_for('index') }}" class="{{ 'active' if active=='home' else '' }}">Home</a>
        <a href="{{ url_for('dashboard') }}" class="{{ 'active' if active=='dashboard' else '' }}">Dashboard</a>
        <a href="{{ url_for('know_more') }}" class="{{ 'active' if active=='about' else '' }}">About</a>
        <a href="{{ url_for('contact') }}" class="{{ 'active' if active=='contact' else '' }}">Contact Us</a>
      </nav>
    </div>
  </header>

  <main class="page-content">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <p>&copy; {{ current_year }} StockSense</p>
  </footer>
  <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
